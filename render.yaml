# MERIDIAN on Render — modular monolith: one web service + Postgres.
# Primary database is MongoDB Atlas (MONGODB_URI from the dashboard);
# Postgres/PGLite remains as the local/auth fallback when MONGODB_URI is unset.
# Cron worker runs the idempotent geodata/weather-cache updater nightly.
services:
  - type: web
    name: meridian
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: WEATHER_PROVIDER
        value: open-meteo
      # Optional — set in the dashboard when you buy coverage:
      # - key: FLIGHT_API_KEY
      #   sync: false
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: AI_API_KEY
      #   sync: false

  - type: cron
    name: meridian-geodata-sync
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: npm install
    startCommand: npm run db:update-geodata
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString

databases:
  - name: meridian-db
    plan: starter
