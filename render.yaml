# MERIDIAN on Render — pure NoSQL MongoDB modular monolith (web service).
# All geo catalog, weather snapshots, flight caches, accounts, OTPs, sessions,
# and saved locations are stored exclusively in MongoDB (`MONGODB_URI`).
projects:
  - name: Meridian
    environments:
      - name: production
        services:
          - type: web
            name: meridian
            runtime: node
            region: oregon
            plan: free
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: MONGODB_URI
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              - key: WEATHER_PROVIDER
                value: open-meteo
              - key: FLIGHT_API_KEY
                sync: false
              - key: GOOGLE_MAPS_API_KEY
                sync: false
              - key: AI_API_KEY
                sync: false
