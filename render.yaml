# MERIDIAN on Render — pure NoSQL MongoDB modular monolith (web service).
# All geo catalog, weather snapshots, flight caches, accounts, OTPs, sessions,
# and saved locations are stored exclusively in MongoDB (`MONGODB_URI`).
projects:
  - name: Meridian
    environments:
      - name: production
        services:
          - type: web
            name: meridian
            runtime: node
            region: oregon
            plan: free
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm start
            healthCheckPath: /api/health
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: MONGODB_URI
                sync: false
              - key: SESSION_SECRET
                generateValue: true
              # Public URL of this service (or your custom domain), e.g.
              # https://meridian.onrender.com — builds the OAuth callback URLs.
              - key: APP_URL
                sync: false
              # Sign-in methods: each one appears on the sign-in screen only
              # once its variables are set. See .env.example for where each
              # value comes from, and `npm run auth:doctor` to verify them.
              - key: GOOGLE_CLIENT_ID
                sync: false
              - key: GOOGLE_CLIENT_SECRET
                sync: false
              - key: MICROSOFT_CLIENT_ID
                sync: false
              - key: MICROSOFT_CLIENT_SECRET
                sync: false
              - key: MICROSOFT_TENANT_ID
                value: common
              - key: APPLE_CLIENT_ID
                sync: false
              - key: APPLE_TEAM_ID
                sync: false
              - key: APPLE_KEY_ID
                sync: false
              - key: APPLE_PRIVATE_KEY
                sync: false
              - key: EMAIL_PROVIDER_KEY
                sync: false
              - key: EMAIL_FROM
                sync: false
              - key: SMS_PROVIDER_KEY
                sync: false
              - key: SMS_PROVIDER_SECRET
                sync: false
              - key: SMS_VERIFY_SERVICE_SID
                sync: false
              - key: WEATHER_PROVIDER
                value: open-meteo
              - key: FLIGHT_API_KEY
                sync: false
              - key: GOOGLE_MAPS_API_KEY
                sync: false
              - key: AI_API_KEY
                sync: false
